<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMERON J. NAIDOO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Full-screen splash gate */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #050505;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .splash-inner {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        /* Glitchy/Experimental Title Style */
        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #ffffff;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        #splash:hover h1 {
            color: #ff3333;
            transform: scale(1.02);
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        .sound-indicator {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            color: #666;
            text-transform: uppercase;
        }

        /* Main experience container once unlocked */
        #experience {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
        }

        .active-view {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <!-- Audio Element (Replace 'your-audio-file.mp3' with your track link or local file) -->
    <audio id="bg-audio" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/arcade_room.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <!-- Splash Gate Overlay -->
    <div id="splash" onclick="startExperience()">
        <div class="splash-inner">
            <h1>STEP INSIDE</h1>
            <div class="sound-indicator">✓ Sound On</div>
        </div>
    </div>

    <!-- Main Content Container (Ready for Three.js next) -->
    <div id="experience">
        <p style="letter-spacing: 0.2em; color: #444; font-size: 0.85rem; text-transform: uppercase;">Environment Ready</p>
    </div>

    <script>
        function startExperience() {
            const splash = document.getElementById('splash');
            const experience = document.getElementById('experience');
            const audio = document.getElementById('bg-audio');

            // 1. Play audio safely inside the user-initiated click event
            audio.play().catch(error => {
                console.log("Audio playback blocked or failed:", error);
            });

            // 2. Fade out and hide the splash screen
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                experience.classList.add('active-view');
            }, 1000);
        }
    </script>
</body>
</html>
