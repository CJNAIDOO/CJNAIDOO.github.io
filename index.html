<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CULTISH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            color: #f3f3f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Splash Screen Overlay */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        .splash-content {
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(255,255,255,0.1);
        }

        .sound-indicator {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: #777;
            text-transform: uppercase;
        }

        /* Main Experience Canvas Container */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Splash Gate -->
    <div id="splash" onclick="initExperience()">
        <div class="splash-content">
            <h1>STEP INSIDE</h1>
            <div class="sound-indicator">✓ Sound On</div>
        </div>
    </div>

    <!-- 3D Canvas Target -->
    <div id="canvas-container"></div>

    <!-- Include Three.js via CDN for quick prototyping -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function initExperience() {
            // Fade out splash screen
            const splash = document.getElementById('splash');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
            }, 800);

            // TODO: Initialize Three.js scene, audio elements, and particle loops here
            console.log("Experience initialized!");
        }
    </script>
</body>
</html>
